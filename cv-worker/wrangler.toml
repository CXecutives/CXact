# The CV worker of CXact: reads a CV through OpenRouter and answers with the AI part of the
# profile (schema.json). Public code, no secrets in the repo.
#
# Deploy by hand, from this folder, after `npx wrangler login`:
#   npx wrangler d1 execute cxact-cv --remote --file schema.sql   once, and after a schema change
#   npx wrangler secret put IP_PEPPER                              once, a random value never shown
#   npx wrangler deploy
# The secret OPENROUTER_API_KEY is already set on the worker. The emergency switch is PAUSED:
# "true" in the dashboard (Worker, Settings, Variables) answers every request with `paused`;
# keep_vars keeps the dashboard's value over this file's on the next deploy.
name = "cxact-cv"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
keep_vars = true

[vars]
PAUSED = "false"

[[d1_databases]]
binding = "DB"
database_name = "cxact-cv"
database_id = "460fbfdd-f422-4324-8bde-24125b8a3bc5"

# Daily: delete the counters older than 31 days.
[triggers]
crons = ["17 3 * * *"]

# The system prompt is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Only the worker's own log lines (codes, sizes, cost); no invocation logs with request data.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
