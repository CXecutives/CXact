# Checks and builds on both target systems. The two runs are independent (fail-fast: false):
# a failure on Windows must not cut off the macOS run and vice versa. CI publishes nothing:
# installers, screenshots and logs are workflow artifacts only.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      # The version lives in rust-toolchain.toml (same as the workstation); rustup installs
      # exactly that one.
      - name: Install Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # Apple Silicon only (aarch64-apple-darwin, docs/PLAN.md). On the arm64 runner this is the
      # host target already; the step keeps the build independent of the runner's architecture.
      - name: Add the macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Create output folders
        shell: bash
        run: mkdir -p artifacts/screenshots artifacts/logs artifacts/bundles

      # Once the UI track lands (package.json), the app embeds the built UI: build it before
      # anything compiles the Tauri context.
      - uses: actions/setup-node@v5
        if: hashFiles('package.json') != ''
        with:
          node-version: lts/*
          cache: npm

      - name: Build UI
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The smoke probe sits behind `debug_assertions` - it exists only in the debug build.
      - name: Debug build
        run: cargo build -p job-alert-monitor

      # ------------------------------------------------------------------ smoke probe
      # Opens a real window, clicks the fetch button and exits with 0 once the demo run is
      # done. A screenshot every 1.5 s alongside - there is no other way to see the macOS UI
      # from outside.
      - name: Smoke probe (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
              $g = [Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
              $bmp.Save($path, [Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "screenshot failed: $_" }
          }
          # Start-Process does not resolve relative paths against $PWD - hence absolute.
          $p = Start-Process -FilePath "$PWD\target\debug\job-alert-monitor.exe" `
            -ArgumentList '--dry-run','--smoke','--smoke-run' `
            -RedirectStandardOutput "$PWD\artifacts\logs\smoke.log" `
            -RedirectStandardError "$PWD\artifacts\logs\smoke.err" -PassThru
          # Windows PowerShell 5.1 fills ExitCode only for a process whose handle was taken
          # while it ran - without this line every exit code reads as empty, and the step passes.
          $null = $p.Handle
          $i = 0
          while (-not $p.HasExited -and $i -lt 100) {
            $i++
            Shot ("$PWD\artifacts\screenshots\smoke-{0:d2}.png" -f $i)
            Start-Sleep -Milliseconds 1500
          }
          if (-not $p.HasExited) { $p.Kill(); throw "smoke probe hung - killed after 150 s." }
          $p.WaitForExit()
          Get-Content "$PWD\artifacts\logs\smoke.log", "$PWD\artifacts\logs\smoke.err" `
            -ErrorAction SilentlyContinue
          if ($null -eq $p.ExitCode) { throw "smoke probe: no exit code." }
          Write-Host "exit code $($p.ExitCode)"
          exit [int]$p.ExitCode

      - name: Smoke probe (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./target/debug/job-alert-monitor --dry-run --smoke --smoke-run \
            > artifacts/logs/smoke.log 2>&1 &
          pid=$!
          i=0
          while kill -0 "$pid" 2>/dev/null && [ "$i" -lt 100 ]; do
            i=$((i + 1))
            screencapture -x "$(printf 'artifacts/screenshots/smoke-%02d.png' "$i")" \
              || echo "screenshot $i failed"
            sleep 1.5
          done
          code=0
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            code=99
          else
            wait "$pid" || code=$?
          fi
          cat artifacts/logs/smoke.log
          echo "exit code $code"
          exit $code

      # ------------------------------------------------------------------ idle screenshots
      # Second pass without the probe: the idle window, so the title bar (macOS: traffic
      # lights, overlay) can be seen at rest. Ended after about 18 s.
      - name: Capture the UI (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath "$PWD\target\debug\job-alert-monitor.exe" `
            -ArgumentList '--dry-run' `
            -RedirectStandardOutput "$PWD\artifacts\logs\ui.log" `
            -RedirectStandardError "$PWD\artifacts\logs\ui.err" -PassThru
          Start-Sleep -Seconds 3
          foreach ($i in 1..10) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            $g = [Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
            $bmp.Save(("$PWD\artifacts\screenshots\ui-{0:d2}.png" -f $i), [Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Start-Sleep -Milliseconds 1500
          }
          if (-not $p.HasExited) { $p.Kill() }

      - name: Capture the UI (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          ./target/debug/job-alert-monitor --dry-run > artifacts/logs/ui.log 2>&1 &
          pid=$!
          sleep 3
          for i in $(seq 1 10); do
            screencapture -x "$(printf 'artifacts/screenshots/ui-%02d.png' "$i")" \
              || echo "screenshot $i failed"
            sleep 1.5
          done
          kill "$pid" 2>/dev/null || true
          sleep 1
          kill -9 "$pid" 2>/dev/null || true
          cat artifacts/logs/ui.log || true
          system_profiler SPDisplaysDataType | head -40 || true

      # ------------------------------------------------------------------ release bundles
      # The Tauri CLI is the pinned devDependency that `npm ci` installed (package.json);
      # --no-install never fetches another version.
      - name: Release bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: src-tauri
        run: npx --no-install tauri build --bundles nsis

      # macOS 26 draws the app icon from an Icon Composer package (src-tauri/icons/CXact.icon,
      # written by tools/icon.py): the system adds shape, glass and shadow. macOS 14 and 15 keep
      # icon.icns (CFBundleIconFile). `tauri build` crashes when bundle.icon lists a .icon
      # (tauri-apps/tauri#15315), so actool (Xcode 26 or later) compiles it here and the
      # release build gets the result through a config overlay: Tauri 2.11 copies a .car from
      # bundle.icon to Contents/Resources, and the overlay's Info.plist adds
      # CFBundleIconName = CXact. Merged configs replace arrays, so the overlay repeats the
      # macOS config's icons. Xcode 26 serves actool only: the app itself keeps being built
      # with the runner's default Xcode and SDK.
      - name: Compile the macOS 26 icon (Icon Composer)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          actool_major() {
            xcrun actool --version --output-format human-readable-text 2>/dev/null \
              | awk '/short-bundle-version/ { split($2, v, "."); print v[1] }' || true
          }
          major=$(actool_major)
          if [ "${major:-0}" -lt 26 ]; then
            xcode=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode-26*.app 2>/dev/null \
              | sort -V | tail -n 1 || true)
            if [ -z "$xcode" ]; then
              echo "::error::no Xcode 26 on the runner (actool ${major:-unknown}) - the .icon cannot be compiled."
              exit 1
            fi
            export DEVELOPER_DIR="$xcode/Contents/Developer"
          fi
          xcrun actool --version --output-format human-readable-text
          out="$RUNNER_TEMP/icon-composer"
          mkdir -p "$out"
          xcrun actool src-tauri/icons/CXact.icon --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$out/partial.plist" \
            --app-icon CXact --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en \
            --target-device mac --minimum-deployment-target 26.0 --platform macosx
          ls -l "$out"
          cp "$out/partial.plist" artifacts/logs/icon-composer-partial.plist
          test -s "$out/Assets.car"
          xcrun assetutil --info "$out/Assets.car" > artifacts/logs/icon-composer-assets.json
          head -c 2000 artifacts/logs/icon-composer-assets.json
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string CXact' "$out/icon-name.plist"
          jq --arg car "$out/Assets.car" --arg plist "$out/icon-name.plist" \
            '{bundle: {icon: (.bundle.icon + [$car]), macOS: {infoPlist: $plist}}}' \
            src-tauri/tauri.macos.conf.json > "$out/tauri.icon.conf.json"
          cat "$out/tauri.icon.conf.json"
          echo "ICON_CONFIG=$out/tauri.icon.conf.json" >> "$GITHUB_ENV"

      # The ad-hoc signature ("-") is set in tauri.macos.conf.json: on Apple silicon an
      # unsigned bundle does not run at all. No developer account, no notarization.
      - name: Release bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri
        run: |
          code=0
          npx --no-install tauri build --target aarch64-apple-darwin --bundles app,dmg \
            --config "$ICON_CONFIG" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::dmg failed on the runner - building the .app only."
            npx --no-install tauri build --target aarch64-apple-darwin --bundles app \
              --config "$ICON_CONFIG"
          fi

      # Both icons are in the .app: Assets.car named by CFBundleIconName for macOS 26 and
      # icon.icns as CFBundleIconFile for macOS 14 and 15.
      - name: Check the app icons (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          app=target/aarch64-apple-darwin/release/bundle/macos/CXact.app
          plist="$app/Contents/Info.plist"
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$plist" 2>/dev/null || true)
          file=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist" 2>/dev/null || true)
          echo "CFBundleIconName '$name', CFBundleIconFile '$file'"
          ls -l "$app/Contents/Resources"
          failed=0
          if [ ! -s "$app/Contents/Resources/Assets.car" ]; then
            echo "::error::the app has no Contents/Resources/Assets.car."
            failed=1
          fi
          if [ "$name" != "CXact" ]; then
            echo "::error::Info.plist has CFBundleIconName '$name', not CXact."
            failed=1
          fi
          if [ "$file" != "icon.icns" ] || [ ! -s "$app/Contents/Resources/icon.icns" ]; then
            echo "::error::CFBundleIconFile is '$file', the macOS 14 and 15 icon is missing."
            failed=1
          fi
          exit $failed

      # The release binary (the one inside the installer) starts and stays up.
      - name: Release probe (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath "$PWD\target\release\job-alert-monitor.exe" `
            -ArgumentList '--dry-run' -PassThru
          $null = $p.Handle  # so that ExitCode is filled (Windows PowerShell 5.1)
          Start-Sleep -Seconds 12
          try {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            $g = [Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\artifacts\screenshots\release-probe.png", [Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          } catch { Write-Host "screenshot failed: $_" }
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive) { throw "the release app exited early (exit code $($p.ExitCode))." }
          Write-Host "release app was up after 12 s"

      # Install probe: mount the dmg like a user, copy the .app into an Applications folder,
      # start the release binary from there, take a screenshot, check that it stays up.
      - name: dmg install probe (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -u
          bundle=target/aarch64-apple-darwin/release/bundle
          echo "macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          echo "WebKit $(defaults read /System/Library/Frameworks/WebKit.framework/Resources/Info.plist CFBundleVersion 2>/dev/null || echo unknown)"
          echo "Safari $(defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString 2>/dev/null || echo unknown)"
          apps="$RUNNER_TEMP/Applications"
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$apps" "$mnt"
          dmg=$(ls "$bundle"/dmg/*.dmg 2>/dev/null | head -n 1 || true)
          mounted=0
          if [ -n "$dmg" ]; then
            hdiutil attach "$dmg" -nobrowse -readonly -noautoopen -mountpoint "$mnt"
            mounted=1
            ditto "$mnt/CXact.app" "$apps/CXact.app"
          else
            echo "::warning::no dmg - probing the .app from the build folder instead."
            ditto "$bundle/macos/CXact.app" "$apps/CXact.app"
          fi
          app="$apps/CXact.app"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier' || true
          lipo -archs "$app/Contents/MacOS/$exe" || true
          "$app/Contents/MacOS/$exe" --dry-run > artifacts/logs/dmg-probe.log 2>&1 &
          pid=$!
          sleep 15
          screencapture -x artifacts/screenshots/dmg-probe.png || echo "screenshot failed"
          alive=0
          if kill -0 "$pid" 2>/dev/null; then alive=1; fi
          kill "$pid" 2>/dev/null || true
          sleep 2
          kill -9 "$pid" 2>/dev/null || true
          if [ "$mounted" = 1 ]; then
            hdiutil detach "$mnt" || hdiutil detach -force "$mnt"
          fi
          cat artifacts/logs/dmg-probe.log
          if [ "$alive" != 1 ]; then
            echo "::error::the installed release app did not stay up."
            exit 1
          fi
          echo "installed release app was up after 15 s"

      # A .app is a folder: upload-artifact would lose the executable bit. ditto keeps it.
      - name: Collect bundles
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/bundle/nsis/*-setup.exe artifacts/bundles/ 2>/dev/null \
              || echo "no setup.exe"
          else
            bundle=target/aarch64-apple-darwin/release/bundle
            if [ -d "$bundle/macos/CXact.app" ]; then
              ditto -c -k --keepParent "$bundle/macos/CXact.app" \
                artifacts/bundles/CXact.app.zip
            else
              echo "no .app"
            fi
            cp "$bundle"/dmg/*.dmg artifacts/bundles/ 2>/dev/null || echo "no dmg"
          fi
          ls -l artifacts/bundles

      - name: Collect app logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # $LOCALAPPDATA comes with backslashes - escape characters in bash.
            source="$(printf '%s' "$LOCALAPPDATA" | tr '\\' '/')/de.cxecutives.job-alert-monitor/logs"
          else
            source="$HOME/Library/Application Support/de.cxecutives.job-alert-monitor/logs"
          fi
          if [ -d "$source" ]; then
            cp -R "$source" artifacts/logs/app-logs
          else
            echo "no app logs under $source"
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ matrix.name }}
          path: |
            artifacts/screenshots
            artifacts/logs
          if-no-files-found: warn

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ matrix.name }}
          path: artifacts/bundles
          if-no-files-found: warn

  # Svelte UI checks and the Playwright harness (Chromium + WebKit). The job only has work
  # once the UI track has landed a package.json; a job-level `if` cannot see the checkout,
  # so every step checks for it.
  ui:
    name: ui (harness)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: No UI package yet
        if: hashFiles('package.json') == ''
        shell: bash
        run: echo "::notice::No package.json yet - nothing to check."

      - uses: actions/setup-node@v5
        if: hashFiles('package.json') != ''
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Check (svelte-check, eslint, stylelint, prettier)
        if: hashFiles('package.json') != ''
        run: npm run check

      - name: Install Playwright browsers
        if: hashFiles('package.json') != ''
        run: npx playwright install --with-deps chromium webkit

      # A flaky test is fixed or removed the same day, never retried to green (CLAUDE.md): the
      # one retry only tells a flaky test (passes on its retry) from a broken one (fails
      # twice) in the report, and --fail-on-flaky-tests keeps the run red for both.
      - name: UI harness
        if: hashFiles('package.json') != ''
        run: npm run harness -- --retries=1 --fail-on-flaky-tests

      - name: Upload harness screenshots and report
        if: always() && hashFiles('package.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ui-harness
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
